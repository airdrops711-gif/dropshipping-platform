apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: saif711-dev
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: image-registry.openshift-image-registry.svc:5000/saif711-dev/dropshipping-backend:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: dropshipping-config
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: dropshipping-secrets
              key: secret_key
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: dropshipping-secrets
              key: stripe_secret_key
        - name: PAYPAL_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: dropshipping-secrets
              key: paypal_client_id
        - name: PAYPAL_SECRET
          valueFrom:
            secretKeyRef:
              name: dropshipping-secrets
              key: paypal_secret
        - name: DATABASE_URL
          value: "postgresql://dropshipping:changeme123@postgres:5432/dropshipping"
        - name: REDIS_URL
          value: "redis://redis:6379/0"
        - name: RABBITMQ_URL
          value: "amqp://guest:guest@rabbitmq:5672/"
        - name: ELASTICSEARCH_URL
          value: "http://elasticsearch:9200"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: saif711-dev
spec:
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
