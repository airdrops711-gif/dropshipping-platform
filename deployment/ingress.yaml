apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dropshipping-ingress
  namespace: dropshipping-platform
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  rules:
  - host: dropshipping.tn
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
